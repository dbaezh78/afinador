<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Afinador de Guitarra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- ══════════════ TUNER PANEL ══════════════ -->
    <div id="tuner-panel">

      <!-- Dial meter -->
      <div id="meter-container">
        <div id="meter-bg">
          <canvas id="meter-canvas"></canvas>
          <!-- Red indicator light -->
          <div id="indicator-light" class="light-red"></div>
        </div>
      </div>

      <!-- Note Wheel -->
      <div id="note-wheel-section">
        <span id="note-wheel-label">Rueda de notas</span>
        <div id="note-wheel">
          <!-- Scrollable note track, built by JS -->
          <div id="note-track"></div>
          <!-- Fixed centre highlight box + bottom pointer -->
          <div id="wheel-center-box"></div>
          <div id="wheel-marker"></div>
        </div>
        <button id="settings-btn" title="Ajustes">⚙</button>
      </div>

    </div>

    <!-- ══════════════ FRETBOARD PANEL ══════════════ -->
    <div id="fretboard-panel">

      <!-- Rotated label -->
      <div id="fretboard-label">
        <span>Guitarra estándar</span>
        <span>Afinación Estándar</span>
      </div>

      <!-- Strings -->
      <div id="strings-container">
        <canvas id="fretboard-canvas"></canvas>
        <div id="strings-list"></div>
      </div>

    </div>

    <!-- ══════════════ NAV BAR ══════════════ -->
    <nav id="navbar">
      <button class="nav-btn active" id="nav-tuner" title="Afinador">🎸</button>
      <button class="nav-btn" id="nav-settings" title="Ajustes">⚙</button>
      <button class="nav-btn" id="nav-fav" title="Favoritos">♥</button>
      <button class="nav-btn" id="nav-learn" title="Aprender">🎓</button>
    </nav>

  </div>

  <script src="tuner.js"></script>
</body>
</html>
